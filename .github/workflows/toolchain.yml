name: Toolchain Snapshot

on:
  schedule:
    - cron: '53 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      llvm_sha:
        description: 'Explicit LLVM commit SHA to build (defaults to upstream main HEAD)'
        required: false
        type: string
      force:
        description: 'Rebuild and trigger sweep even if state.json already matches SHA'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: toolchain-snapshot-master
  cancel-in-progress: false

jobs:
  check:
    name: Check Upstream LLVM Trunk
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      llvm_sha: ${{ steps.decide.outputs.llvm_sha }}
      llvm_sha12: ${{ steps.decide.outputs.llvm_sha12 }}
      previous_sha: ${{ steps.decide.outputs.previous_sha }}
    steps:
      - name: Checkout data branch if present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init _data
          rc=0
          git ls-remote --exit-code --heads "${remote}" refs/heads/data >/dev/null || rc=$?
          case "${rc}" in
            0)
              git -C _data fetch --depth=1 "${remote}" refs/heads/data:refs/heads/data
              git -C _data checkout data
              ;;
            2)
              ;;
            *)
              exit "${rc}"
              ;;
          esac

      - name: Compare against data/state.json
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SHA: ${{ inputs.llvm_sha }}
          FORCE_BUILD: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA}" ]; then
            target_sha="${INPUT_SHA}"
          else
            target_sha="$(git ls-remote https://github.com/llvm/llvm-project.git refs/heads/main | awk '{print $1}')"
          fi
          if [ -z "${target_sha}" ]; then
            echo "cannot resolve upstream main SHA" >&2
            exit 1
          fi
          sha12="${target_sha:0:12}"

          prev_sha=""
          if [ -f _data/state.json ]; then
            prev_sha="$(jq -r '.last_sweep_sha // ""' _data/state.json)"
          fi

          echo "llvm_sha=${target_sha}" >> "$GITHUB_OUTPUT"
          echo "llvm_sha12=${sha12}" >> "$GITHUB_OUTPUT"
          echo "previous_sha=${prev_sha}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE_BUILD}" != "true" ] && [ "${target_sha}" = "${prev_sha}" ]; then
            echo "already at ${sha12}"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build LLVM (${{ matrix.platform }})
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Free runner disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          PLAT: ${{ matrix.platform }}
        run: |
          pkgs="ccache clang lld ninja-build"
          if [ "${PLAT}" = "linux-x86_64" ]; then
            pkgs="$pkgs libc6-dev-riscv64-cross libstdc++-13-dev-riscv64-cross libgcc-13-dev-riscv64-cross"
          fi
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends $pkgs

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-toolchain-${{ matrix.platform }}-${{ needs.check.outputs.llvm_sha12 }}
          restore-keys: |
            ccache-toolchain-${{ matrix.platform }}-

      - name: Fetch LLVM source at ${{ needs.check.outputs.llvm_sha12 }}
        env:
          LLVM_SHA: ${{ needs.check.outputs.llvm_sha }}
        run: |
          git init llvm-project
          git -C llvm-project remote add origin https://github.com/llvm/llvm-project.git
          git -C llvm-project fetch --filter=blob:none --depth=1 origin "${LLVM_SHA}"
          git -C llvm-project checkout --detach FETCH_HEAD

      - name: Configure & build toolchain + ASan/UBSan runtimes
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPRESS: 'true'
        run: |
          cmake -G Ninja \
            -S llvm-project/llvm \
            -B build \
            -C scripts/toolchain.cmake

          ninja -C build \
            clang lld opt llc llubi \
            llvm-extract llvm-reduce llvm-link llvm-dis \
            llvm-ar llvm-ranlib llvm-nm llvm-objcopy llvm-symbolizer \
            clang-resource-headers builtins runtimes

          ccache -s || true

      - name: Stage & package llvm-${{ needs.check.outputs.llvm_sha12 }}-${{ matrix.platform }}.tar.zst
        env:
          SHA12: ${{ needs.check.outputs.llvm_sha12 }}
          PLAT: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          stage="llvm-${SHA12}-${PLAT}"
          mkdir -p "${stage}/bin" "${stage}/lib"

          for tool in \
            clang clang++ clang-* \
            lld ld.lld ld64.lld \
            opt llc llubi \
            llvm-extract llvm-reduce llvm-link llvm-dis \
            llvm-ar llvm-ranlib llvm-nm llvm-objcopy llvm-symbolizer; do
            for path in build/bin/${tool}; do
              [ -e "${path}" ] || [ -L "${path}" ] || continue
              cp -a "${path}" "${stage}/bin/"
            done
          done

          for bin in "${stage}"/bin/*; do
            if [ -f "${bin}" ] && [ ! -L "${bin}" ]; then
              strip "${bin}" 2>/dev/null || true
            fi
          done

          cp -a build/lib/clang "${stage}/lib/"
          tar -C "${stage}" -cf - bin lib | zstd -T0 -10 -q -o "${stage}.tar.zst"
          ls -lh "${stage}.tar.zst"

      - name: Upload snapshot tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-${{ matrix.platform }}
          path: llvm-${{ needs.check.outputs.llvm_sha12 }}-${{ matrix.platform }}.tar.zst
          retention-days: 2

  publish:
    name: Publish Snapshot Release, Prune >14d & Trigger Sweep
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download built platform tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: toolchain-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release toolchain-${{ needs.check.outputs.llvm_sha12 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA12: ${{ needs.check.outputs.llvm_sha12 }}
        run: |
          tag="toolchain-${SHA12}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" dist/llvm-"${SHA12}"-*.tar.zst \
              --target master \
              --title "Toolchain snapshot \`${SHA12}\`" \
              --notes "Clang/LLD/compiler-rt snapshot for \`${SHA12}\`."
          else
            gh release upload "${tag}" dist/llvm-"${SHA12}"-*.tar.zst --clobber
          fi

      - name: Prune unreferenced toolchain snapshots older than 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA12: ${{ needs.check.outputs.llvm_sha12 }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          keep_file="$(mktemp)"
          trap 'rm -f "${keep_file}"' EXIT
          if [ -n "${SHA12}" ]; then
            printf '%s\n' "${SHA12}" >> "${keep_file}"
          fi

          git init _data
          rc=0
          git ls-remote --exit-code --heads "${remote}" refs/heads/data >/dev/null || rc=$?
          case "${rc}" in
            0)
              git -C _data fetch --depth=1 "${remote}" refs/heads/data:refs/heads/data
              git -C _data checkout data
              if [ -f _data/state.json ]; then
                jq -r '
                  [
                    .last_sweep_sha,
                    .last_good_sha,
                    (.retained_toolchains // [])[],
                    (.last_good_by_target // {} | values[])
                  ]
                  | map(select(. != null and . != "") | .[0:12])
                  | unique | .[]
                ' _data/state.json >> "${keep_file}"
              fi
              if compgen -G "_data/incidents/*.json" >/dev/null; then
                jq -r 'select(.status == "open") | [.good_sha, .bad_sha, .culprit_sha] | map(select(. != null and . != "") | .[0:12]) | .[]' _data/incidents/*.json >> "${keep_file}"
              fi
              ;;
            2)
              ;;
            *)
              exit "${rc}"
              ;;
          esac
          sort -u -o "${keep_file}" "${keep_file}"

          cutoff_epoch="$(date -u -d '14 days ago' +%s)"
          gh release list --limit 500 --json tagName,createdAt | jq -c '.[]' | while IFS= read -r rel; do
            tag="$(printf '%s' "${rel}" | jq -r '.tagName')"
            case "${tag}" in
              toolchain-*) ;;
              *) continue ;;
            esac
            sha12="${tag#toolchain-}"
            if grep -Fxq "${sha12}" "${keep_file}"; then
              continue
            fi
            created="$(printf '%s' "${rel}" | jq -r '.createdAt')"
            rel_epoch="$(date -u -d "${created}" +%s)"
            if [ "${rel_epoch}" -lt "${cutoff_epoch}" ]; then
              echo "prune ${tag}"
              gh release delete "${tag}" --cleanup-tag --yes || true
            fi
          done

      - name: Trigger sweep.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLVM_SHA: ${{ needs.check.outputs.llvm_sha }}
          PREV_SHA: ${{ needs.check.outputs.previous_sha }}
        run: |
          gh workflow run sweep.yml \
            --ref master \
            -f llvm_sha="${LLVM_SHA}" \
            -f previous_sha="${PREV_SHA}"
