name: Miscompile Triage

on:
  workflow_dispatch:
    inputs:
      bad_sha:
        description: 'Failing LLVM commit SHA'
        required: true
        type: string
      regressions_json:
        description: 'JSON array of failing entries from sweep aggregate'
        required: false
        type: string
      package:
        description: 'Single package name (manual dispatch)'
        required: false
        type: string
      platform:
        description: 'Single platform ID (manual dispatch: linux-x86_64, linux-aarch64, linux-riscv64, darwin-arm64)'
        required: false
        type: string
      profile:
        description: 'Single profile ID (manual dispatch: distro-O2 or release-lto)'
        required: false
        type: string
      good_sha:
        description: 'Last-known-good LLVM commit SHA (manual dispatch)'
        required: false
        type: string
      test_id:
        description: 'Specific failing subtest ID (manual dispatch)'
        required: false
        type: string

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: miscompile-triage
  cancel-in-progress: false

jobs:
  prepare:
    name: Build Triage Matrix
    runs-on: ubuntu-24.04
    outputs:
      has_entries: ${{ steps.matrix.outputs.has_entries }}
      matrix_json: ${{ steps.matrix.outputs.matrix_json }}
    steps:
      - name: Normalize regression entries
        id: matrix
        env:
          BAD_SHA: ${{ inputs.bad_sha }}
          REGRESSIONS_JSON: ${{ inputs.regressions_json }}
          SINGLE_PKG: ${{ inputs.package }}
          SINGLE_PLAT: ${{ inputs.platform }}
          SINGLE_PROF: ${{ inputs.profile }}
          SINGLE_GOOD: ${{ inputs.good_sha }}
          SINGLE_TEST: ${{ inputs.test_id }}
        run: |
          set -euo pipefail
          if [ -n "${REGRESSIONS_JSON}" ]; then
            raw="${REGRESSIONS_JSON}"
          elif [ -n "${SINGLE_PKG}" ] && [ -n "${SINGLE_PLAT}" ]; then
            raw="$(jq -nc \
              --arg pkg "${SINGLE_PKG}" \
              --arg plat "${SINGLE_PLAT}" \
              --arg prof "${SINGLE_PROF:-distro-O2}" \
              --arg good "${SINGLE_GOOD}" \
              --arg bad "${BAD_SHA}" \
              --arg tid "${SINGLE_TEST}" \
              '[{
                package: $pkg,
                platform: $plat,
                profile: $prof,
                good_sha: $good,
                bad_sha: $bad,
                failed_tests: (if $tid == "" then [] else [$tid] end)
              }]')"
          else
            raw="[]"
          fi

          enriched="$(printf '%s' "${raw}" | jq -c --arg bad "${BAD_SHA}" '
            map(select((.good_sha // "") != "") | . + {
              bad_sha: (.bad_sha // $bad),
              bad_sha12: ((.bad_sha // $bad)[0:12]),
              test_id: ((.failed_tests // [])[0] // ""),
              runner: (
                if .platform == "linux-x86_64" or .platform == "linux-riscv64" then "ubuntu-24.04"
                elif .platform == "linux-aarch64" then "ubuntu-24.04-arm"
                else "macos-latest"
                end
              ),
              tc_platform: (
                if .platform == "linux-riscv64" then "linux-x86_64"
                else .platform
                end
              )
            })
          ')"

          count="$(printf '%s' "${enriched}" | jq 'length')"
          if [ "${count}" -gt 0 ]; then
            echo "has_entries=true" >> "$GITHUB_OUTPUT"
            echo "matrix_json={\"include\":${enriched}}" >> "$GITHUB_OUTPUT"
          else
            echo "has_entries=false" >> "$GITHUB_OUTPUT"
            echo "matrix_json={\"include\":[]}" >> "$GITHUB_OUTPUT"
          fi

  triage:
    name: Triage ${{ matrix.package }} (${{ matrix.platform }} / ${{ matrix.profile }})
    needs: prepare
    if: needs.prepare.outputs.has_entries == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix_json) }}
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Free runner disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          PKG: ${{ matrix.package }}
          PLAT: ${{ matrix.platform }}
        run: |
          pkgs="ccache clang lld ninja-build"
          if [ "${PKG}" = "dav1d" ]; then
            pkgs="$pkgs meson"
          fi
          if [ "${PLAT}" = "linux-riscv64" ]; then
            pkgs="$pkgs libc6-dev-riscv64-cross libstdc++-13-dev-riscv64-cross libgcc-13-dev-riscv64-cross"
          fi
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends $pkgs

      - name: Set up QEMU RVA23 (linux-riscv64)
        if: matrix.platform == 'linux-riscv64'
        run: |
          docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3-68 --install riscv64
          echo "QEMU_CPU=rva23u64" >> "$GITHUB_ENV"
          echo "QEMU_LD_PREFIX=/usr/riscv64-linux-gnu" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          PKG: ${{ matrix.package }}
        run: |
          pkgs="ccache"
          if [ "${PKG}" = "dav1d" ]; then
            pkgs="$pkgs meson"
          fi
          brew install $pkgs

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build lmc
        run: go build -o lmc .

      - name: Download good and bad prebuilt LLVM snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOD_SHA: ${{ matrix.good_sha }}
          BAD_SHA: ${{ matrix.bad_sha }}
          TC_PLAT: ${{ matrix.tc_platform }}
        run: |
          set -euo pipefail
          good12="${GOOD_SHA:0:12}"
          bad12="${BAD_SHA:0:12}"
          mkdir -p "${RUNNER_TEMP}/tc-good" "${RUNNER_TEMP}/tc-bad"

          gh release download "toolchain-${good12}" \
            --pattern "llvm-${good12}-${TC_PLAT}.tar.zst" \
            --dir "${RUNNER_TEMP}/tc-good"
          zstd -dc "${RUNNER_TEMP}/tc-good/llvm-${good12}-${TC_PLAT}.tar.zst" | tar -xf - -C "${RUNNER_TEMP}/tc-good"
          rm -f "${RUNNER_TEMP}/tc-good/llvm-${good12}-${TC_PLAT}.tar.zst"

          gh release download "toolchain-${bad12}" \
            --pattern "llvm-${bad12}-${TC_PLAT}.tar.zst" \
            --dir "${RUNNER_TEMP}/tc-bad"
          zstd -dc "${RUNNER_TEMP}/tc-bad/llvm-${bad12}-${TC_PLAT}.tar.zst" | tar -xf - -C "${RUNNER_TEMP}/tc-bad"
          rm -f "${RUNNER_TEMP}/tc-bad/llvm-${bad12}-${TC_PLAT}.tar.zst"

      - name: Restore ccache for single-TU commit bisection
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-bisect-${{ matrix.platform }}-${{ matrix.bad_sha }}
          restore-keys: |
            ccache-toolchain-${{ matrix.tc_platform }}-${{ matrix.bad_sha12 }}
            ccache-toolchain-${{ matrix.tc_platform }}-
            ccache-bisect-${{ matrix.platform }}-

      - name: Fetch llvm-project history
        env:
          GOOD_SHA: ${{ matrix.good_sha }}
          BAD_SHA: ${{ matrix.bad_sha }}
        run: |
          git init "${RUNNER_TEMP}/llvm-project"
          git -C "${RUNNER_TEMP}/llvm-project" remote add origin https://github.com/llvm/llvm-project.git
          git -C "${RUNNER_TEMP}/llvm-project" fetch --filter=blob:none origin "${GOOD_SHA}" "${BAD_SHA}"
          git -C "${RUNNER_TEMP}/llvm-project" checkout --detach "${BAD_SHA}"

      - name: Run lmc triage
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: ${{ runner.os == 'macOS' && '2.5G' || '1.5G' }}
          CCACHE_COMPRESS: 'true'
          TEST_ID: ${{ matrix.test_id }}
          PKG: ${{ matrix.package }}
          PLAT: ${{ matrix.platform }}
          PROF: ${{ matrix.profile }}
          GOOD_SHA: ${{ matrix.good_sha }}
          BAD_SHA: ${{ matrix.bad_sha }}
        run: |
          set -euo pipefail
          mkdir -p out/dist out/store out/ir
          extra_args=()
          if [ -n "${TEST_ID}" ]; then
            extra_args+=(-test "${TEST_ID}")
          fi

          if command -v ccache >/dev/null 2>&1; then
            ccache -z || true
          fi

          set +e
          ./lmc triage \
            -corpus corpus \
            -pkg "${PKG}" \
            -plat "${PLAT}" \
            -prof "${PROF}" \
            -good-tc "${RUNNER_TEMP}/tc-good/bin" \
            -bad-tc "${RUNNER_TEMP}/tc-bad/bin" \
            -good "${GOOD_SHA}" \
            -bad "${BAD_SHA}" \
            -llvm "${RUNNER_TEMP}/llvm-project" \
            -dir "${RUNNER_TEMP}/triage-work" \
            -cache "${RUNNER_TEMP}/lmc-cache" \
            -bundle out/dist \
            -store out/store \
            -out out/incident.json \
            -status-out out/status.json \
            -timeout 215m \
            -commit-timeout 90m \
            "${extra_args[@]}" 2>&1 | tee out/triage.log
          rc=${PIPESTATUS[0]}
          set -e

          if command -v ccache >/dev/null 2>&1; then
            ccache -s || true
          fi

          if [ "${rc}" -ne 0 ] && [ ! -f out/status.json ]; then
            jq -nc \
              --arg target "${PKG}|${PLAT}|${PROF}" \
              --arg good "${GOOD_SHA}" \
              --arg bad "${BAD_SHA}" \
              --arg detail "$(tail -c 800 out/triage.log 2>/dev/null || true)" \
              '{target: $target, good_sha: $good, bad_sha: $bad, outcome: "error", detail: $detail}' > out/status.json
          fi

          if [ "${rc}" -ne 0 ]; then
            exit "${rc}"
          fi

          alive_status=""
          if [ -f out/incident.json ]; then
            alive_status="$(jq -r '.alive_tv_status // ""' out/incident.json)"
          fi
          if [ -f out/incident.json ] && { [ -z "${alive_status}" ] || [ "${alive_status}" = "unavailable" ]; }; then
            rb="$(find "${RUNNER_TEMP}/triage-work" -maxdepth 4 -name 'reduced_before.ll' -print -quit 2>/dev/null || true)"
            ra="$(find "${RUNNER_TEMP}/triage-work" -maxdepth 4 -name 'reduced_after.ll' -print -quit 2>/dev/null || true)"
            if [ -s "${rb}" ] && [ -s "${ra}" ]; then
              cp "${rb}" out/ir/before.ll
              cp "${ra}" out/ir/after.ll
            else
              b="$(find "${RUNNER_TEMP}/triage-work" -maxdepth 4 -name 'before.ll' -print -quit 2>/dev/null || true)"
              a="$(find "${RUNNER_TEMP}/triage-work" -maxdepth 4 -name 'after.ll' -print -quit 2>/dev/null || true)"
              if [ -s "${b}" ] && [ -s "${a}" ]; then
                cp "${b}" out/ir/before.ll
                cp "${a}" out/ir/after.ll
              fi
            fi
          fi

      - name: Upload triage output artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-${{ matrix.package }}-${{ matrix.platform }}-${{ matrix.profile }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  alive2-verify:
    name: alive-tv
    needs: [prepare, triage]
    if: always() && !cancelled() && needs.prepare.outputs.has_entries == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Download triage artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: triage-*
          path: triaged

      - name: Check for IR diffs
        id: check_ir
        run: |
          mkdir -p triaged
          if [ -n "$(find triaged -name 'before.ll' -print -quit)" ]; then
            echo "has_ir=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ir=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check_ir.outputs.has_ir == 'true'
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            ccache clang lld libz3-dev re2c

      - name: Set up Go
        if: steps.check_ir.outputs.has_ir == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build lmc
        if: steps.check_ir.outputs.has_ir == 'true'
        run: go build -o lmc .

      - name: Restore ccache
        if: steps.check_ir.outputs.has_ir == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache-alive2
          key: ccache-alive2-linux-x86_64-${{ inputs.bad_sha }}
          restore-keys: |
            ccache-alive2-linux-x86_64-

      - name: Fetch LLVM source
        if: steps.check_ir.outputs.has_ir == 'true'
        env:
          BAD_SHA: ${{ inputs.bad_sha }}
        run: |
          git init "${RUNNER_TEMP}/llvm-project"
          git -C "${RUNNER_TEMP}/llvm-project" remote add origin https://github.com/llvm/llvm-project.git
          git -C "${RUNNER_TEMP}/llvm-project" fetch --filter=blob:none --depth=1 origin "${BAD_SHA}"
          git -C "${RUNNER_TEMP}/llvm-project" checkout --detach FETCH_HEAD

      - name: Build and run alive-tv
        if: steps.check_ir.outputs.has_ir == 'true'
        env:
          BAD_SHA: ${{ inputs.bad_sha }}
          CCACHE_DIR: ${{ runner.temp }}/ccache-alive2
          CCACHE_MAXSIZE: 1.5G
          CCACHE_COMPRESS: 'true'
        run: |
          set -euo pipefail
          ccache -z || true
          if ! BUILD_ALIVE2_LLVM=1 LLVM_SRC="${RUNNER_TEMP}/llvm-project" \
            ./scripts/build-alive2-linux.sh /tmp/alive2/bin/alive-tv ||
            [ ! -x /tmp/alive2/bin/alive-tv ]; then
            echo "::warning::alive-tv build failed against LLVM ${BAD_SHA}; continuing without Alive2 verification"
            ccache -s || true
            exit 0
          fi
          ccache -s || true

          for dir in triaged triaged/triage-*; do
            [ -d "${dir}" ] || continue
            inc="${dir}/incident.json"
            before="${dir}/ir/before.ll"
            after="${dir}/ir/after.ll"
            [ -f "${inc}" ] && [ -f "${before}" ] && [ -f "${after}" ] || continue

            if ! ./lmc alive-check \
              -alive-tv /tmp/alive2/bin/alive-tv \
              -before "${before}" \
              -after "${after}" \
              -inc "${inc}"; then
              echo "::warning::alive-check failed for ${dir}"
            fi
          done

      - name: Upload verified triage bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triaged-verified
          path: triaged/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Upload Reproducers, Update Dashboard & Sync GitHub Issues
    needs: [prepare, triage, alive2-verify]
    if: always() && !cancelled() && needs.prepare.outputs.has_entries == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: data-gh-pages-write
      cancel-in-progress: false
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build lmc
        run: go build -o lmc .

      - name: Download verified triage artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: triaged-verified
          path: verified

      - name: Check verified triage artifacts
        id: check_verified
        run: |
          mkdir -p verified
          if [ -n "$(find verified \( -name 'incident.json' -o -name 'status.json' \) -print -quit)" ]; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fallback download raw triage artifacts
        if: steps.check_verified.outputs.has_artifacts != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: triage-*
          path: verified

      - name: Checkout orphan data and gh-pages branches
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          ./scripts/sync-branch.sh checkout data _data
          mkdir -p _data/incidents _data/sweeps
          ./scripts/sync-branch.sh checkout gh-pages _site

      - name: Record triage outcomes, upload bundles & merge incidents
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verified
          for stf in verified/status.json verified/triage-*/status.json; do
            [ -f "${stf}" ] || continue
            ./lmc record-triage -store _data -status "${stf}"
          done

          if [ -z "$(find verified -name 'incident.json' -print -quit)" ]; then
            exit 0
          fi

          if ! gh release view reproducers >/dev/null 2>&1; then
            gh release create reproducers \
              --target master \
              --title "Reproducer archives" \
              --notes "reproducer-<id>.tar.zst archives."
          fi

          for dir in verified verified/triage-*; do
            [ -f "${dir}/incident.json" ] || continue
            inc_id="$(jq -r '.id // ""' "${dir}/incident.json")"
            [ -n "${inc_id}" ] || continue

            bundle_url=""
            for archive in "${dir}"/dist/reproducer-*.tar.zst; do
              [ -f "${archive}" ] || continue
              fname="$(basename "${archive}")"
              gh release upload reproducers "${archive}" --clobber
              bundle_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/reproducers/${fname}"
            done

            ./lmc merge-incident \
              -store _data \
              -inc "${dir}/incident.json" \
              -bundle-url "${bundle_url}"
          done

      - name: Sync issues
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          BAD_SHA: ${{ inputs.bad_sha }}
        run: |
          ./lmc sync-issues \
            -store _data \
            -repo "${GH_REPO}" \
            -url "https://llvm-miscompile-canary.glendalab.com" \
            -sha "${BAD_SHA}"

      - name: Build site
        run: |
          ./lmc site -store _data -out _site -corpus corpus
          test "$(tr -d '\r\n' < _site/CNAME)" = "llvm-miscompile-canary.glendalab.com"

      - name: Commit & push data and gh-pages
        env:
          BAD_SHA: ${{ inputs.bad_sha }}
        run: |
          sha12="${BAD_SHA:0:12}"
          ./scripts/sync-branch.sh push data _data "data: update triage incidents for ${sha12}"
          ./scripts/sync-branch.sh push gh-pages _site "site: publish triaged incidents for ${sha12}"
