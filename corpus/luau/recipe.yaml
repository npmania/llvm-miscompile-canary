name: luau
category: Language VMs & Runtimes
repo: luau-lang/luau
version: "0.747"
url: https://github.com/luau-lang/luau/archive/refs/tags/0.747.tar.gz
sha256: 2c72471f91c42af7f2c07cc4cc602b27c215346d491d7ab3d80da63050ad43f2
strip_components: 1
lang: cxx
timeout_min: 15
smoke_test: Conformance:Basic
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-arm64
description: Luau typed Lua VM, bytecode compiler, and type checker
cmake:
  flags:
    - -DLUAU_BUILD_CLI=OFF
    - -DLUAU_BUILD_TESTS=ON
    - -DLUAU_BUILD_WEB=OFF
