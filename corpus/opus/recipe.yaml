name: opus
category: Codecs & DSP
repo: xiph/opus
version: v1.5.2
url: https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz
sha256: 65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1
strip_components: 1
lang: c
timeout_min: 15
smoke_test: test_opus_padding
platforms:
  - linux-x86_64
  - linux-aarch64
  - linux-riscv64
  - darwin-arm64
description: Xiph Opus low-latency speech and audio codec (SILK + CELT DSP)
cmake:
  flags:
    - -DOPUS_BUILD_TESTING=ON
    - -DOPUS_BUILD_SHARED_LIBRARY=OFF
    - -DOPUS_BUILD_PROGRAMS=OFF
    - -DBUILD_SHARED_LIBS=OFF
ctest:
  exclude: "^test_opus_encode$"
  env:
    SEED: "1"
