name: highway
category: Linear Algebra & SIMD
repo: google/highway
version: 1.4.0
url: https://github.com/google/highway/releases/download/1.4.0/highway-1.4.0.tar.gz
sha256: 36f672ab48ddb3c8555e9e89e16fe400cd7d16c6eb455a1a3d0c146a63ababdc
strip_components: 1
lang: cxx
timeout_min: 20
smoke_test: arithmetic_test
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-arm64
description: Google Highway multi-target C++ SIMD library
cmake:
  cxxflags: -DHWY_COMPILE_ONLY_STATIC
  flags:
    - -DBUILD_SHARED_LIBS=OFF
    - -DHWY_ENABLE_EXAMPLES=OFF
    - -DHWY_ENABLE_CONTRIB=OFF
    - -DHWY_ENABLE_INSTALL=OFF
    - -DHWY_ENABLE_TESTS=ON
    - -DHWY_TEST_STANDALONE=ON
    - -DHWY_WARNINGS_ARE_ERRORS=OFF
  targets:
    - base_test
    - arithmetic_test
    - compare_test
    - convert_test
    - logical_test
    - memory_test
    - mul_test
    - swizzle_test
