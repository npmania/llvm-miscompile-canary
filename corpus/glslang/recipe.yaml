name: glslang
category: Compilers & IR
repo: KhronosGroup/glslang
version: 16.6.0
url: https://github.com/KhronosGroup/glslang/archive/refs/tags/16.6.0.tar.gz
sha256: 9c09b901149c729df745057dafa815278aaa101b84d2b6e14f16a42de52f97f2
strip_components: 1
lang: cxx
timeout_min: 15
smoke_test: reflection.vert
platforms:
  - linux-x86_64
  - linux-aarch64
  - linux-riscv64
  - darwin-arm64
description: Khronos reference GLSL/ESSL/HLSL front-end compiler and SPIR-V generator
cmake:
  flags:
    - -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
    - -DBUILD_SHARED_LIBS=OFF
    - -DENABLE_PCH=OFF
    - -DENABLE_OPT=OFF
    - -DBUILD_EXTERNAL=OFF
    - -DALLOW_EXTERNAL_SPIRV_TOOLS=OFF
    - -DALLOW_EXTERNAL_GTEST=OFF
    - -DENABLE_GLSLANG_BINARIES=ON
    - -DGLSLANG_TESTS=OFF
    - -DGLSLANG_ENABLE_INSTALL=OFF
    - -DBUILD_WERROR=OFF
  targets:
    - glslang-standalone
