name: libjpeg-turbo
category: Image & HDR FP16
repo: libjpeg-turbo/libjpeg-turbo
version: 3.2.1
url: https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.1/libjpeg-turbo-3.2.1.tar.gz
sha256: c27ad72a68da151177929aa969ae773a2da5ac2af9ce946079314fdac8cece7f
strip_components: 1
lang: c
timeout_min: 15
smoke_test: cjpeg-static-rgb-islow-cmp
platforms:
  - linux-x86_64
  - linux-aarch64
  - linux-riscv64
  - darwin-arm64
description: libjpeg-turbo JPEG codec and TurboJPEG API with external SIMD disabled
cmake:
  cflags: -ffp-contract=off
  flags:
    - -DWITH_SIMD=OFF
    - -DENABLE_SHARED=OFF
    - -DENABLE_STATIC=ON
    - -DWITH_TURBOJPEG=ON
    - -DWITH_JAVA=OFF
    - -DFLOATTEST8=no-fp-contract
    - -DFLOATTEST12=no-fp-contract
ctest:
  # bmpsizetest* allocates multi-GiB buffers and OOMs CI runners
  exclude: "^bmpsizetest"
